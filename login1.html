<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CICT Code Forum</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>CICT Code Forum</h1>
        <p>Welcome back!</p>
    </header>

    <main>
        <section class="login-container">
            <h2>Login</h2>

            <form id="loginForm">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p>Don't have an account? <a href="signup1.html">Sign Up here</a></p>
            <p><a href="index1.html">← Back to Home</a></p>

            <div class="demo-accounts">
                <p class="form-note"><strong>Demo accounts:</strong></p>
                <p class="form-note">Admin: <code>admin</code> / <code>Admin@123</code></p>
                <p class="form-note">Designer: <code>designer</code> / <code>Designer@123</code></p>
            </div>
        </section>
    </main>

    <footer>
        <p>CICT Code Forum © 2026</p>
    </footer>

    <script src="script1.js"></script>
</body>
</html>
