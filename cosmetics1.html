<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetics Shop - CICT Code Forum</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="shop-header">
        <h1>Cosmetics Shop</h1>
        <p>Preview an item on your character before you buy it.</p>
        <nav>
            <a href="forum1.html">Forum</a>
            <a href="index1.html">Home</a>
            <button type="button" onclick="logoutUser()">Logout</button>
        </nav>
    </header>

    <main class="shop-container">
        <section class="shop-player">
            <h2>Your character</h2>

            <div id="characterPreview">
                <div class="character-area">
                    <div class="character">
                        <div class="character-layer character-base"></div>
                        <div id="characterLayers"></div>
                    </div>
                </div>
            </div>

            <p class="points-line">
                Points
                <strong id="shopPoints">0</strong>
            </p>

            <div id="previewBar" class="preview-bar" hidden></div>
        </section>

        <section class="shop-categories">
            <h2>Categories</h2>

            <button type="button" class="category-button" data-category="hats">Hats</button>
            <button type="button" class="category-button" data-category="face">Face</button>
            <button type="button" class="category-button" data-category="tops">Tops</button>
            <button type="button" class="category-button" data-category="pants">Pants</button>
            <button type="button" class="category-button" data-category="shoes">Shoes</button>
            <button type="button" class="category-button" data-category="themes">Themes</button>
        </section>

        <section class="cosmetics-section">
            <h2 id="categoryTitle">Cosmetics</h2>
            <div id="cosmeticsContainer"></div>
        </section>

        <section class="equipped-section">
            <h2>My inventory</h2>
            <div id="equippedItems"></div>
        </section>
    </main>

    <footer>
        <p>CICT Code Forum © 2026</p>
    </footer>

    <script src="script1.js"></script>
</body>
</html>
