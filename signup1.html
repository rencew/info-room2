<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CICT Code Forum</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>CICT Code Forum</h1>
        <p>Create your account</p>
    </header>

    <main>
        <section class="signup-container">
            <h2>Create an Account</h2>

            <form id="signupForm">
                <label for="role">I am a...</label>
                <select id="role" name="role" required>
                    <option value="">Select role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                <label for="studentID" id="idLabel">Student / Employee ID</label>
                <input type="text" id="studentID" name="studentID" placeholder="Enter your ID number" required>

                <label for="section" id="sectionLabel">Section / Department</label>
                <input type="text" id="section" name="section" placeholder="Example: BSIT 1A or CICT Dept" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Create a username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>

                <label for="coe" id="coeLabel">Certificate of Enrollment / Faculty ID</label>
                <p class="form-note" id="coeNote">
                    Upload a clear photo of your Certificate of Enrollment (students)
                    or Faculty/Employee ID (teachers) for admin verification.
                </p>
                <input type="file" id="coe" name="coe" accept="image/*" required>

                <button type="submit">Create Account</button>
            </form>

            <p>Already have an account? <a href="login1.html">Login here</a></p>
            <p><a href="index1.html">← Back to Home</a></p>
        </section>
    </main>

    <footer>
        <p>CICT Code Forum © 2026</p>
    </footer>

    <script src="script1.js"></script>
</body>
</html>
