<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CICT Code Forum</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="admin-header">
        <h1>Admin Dashboard</h1>
        <p>CICT Code Forum Management</p>
        <nav>
            <a href="forum1.html">Forum</a>
            <a href="designer1.html">Designer</a>
            <a href="index1.html">Home</a>
            <button type="button" onclick="logoutUser()">Logout</button>
        </nav>
    </header>

    <main class="admin-container">
        <section class="admin-section">
            <h2>Pending Registrations</h2>
            <div id="pendingAccounts"></div>
        </section>

        <section class="admin-section">
            <h2>Approved Accounts</h2>
            <div id="approvedAccounts"></div>
        </section>

        <section class="admin-section">
            <h2>Pending Posts (Awaiting Approval)</h2>
            <div id="pendingPosts"></div>
        </section>

        <section class="admin-section">
            <h2>Reported Posts</h2>
            <div id="reportedPosts"></div>
        </section>

        <section class="admin-section">
            <h2>All Forum Posts</h2>
            <div id="adminPosts"></div>
        </section>

        <section class="admin-section admin-danger">
            <h2>System Management</h2>
            <p>Use this only when testing the website.</p>
            <button id="clearDataButton">Clear Test Data</button>
        </section>
    </main>

    <footer>
        <p>CICT Code Forum © 2026</p>
    </footer>

    <script src="script1.js"></script>
</body>
</html>
