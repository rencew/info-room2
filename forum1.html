<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum - CICT Code Forum</title>
    <link rel="stylesheet" href="style1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="forum-header">
        <h1>CICT Code Forum</h1>
        <nav>
            <a href="forum1.html">Forum</a>
            <a href="cosmetics1.html">Shop</a>
            <a href="index1.html">Home</a>
            <button type="button" onclick="logoutUser()">Logout</button>
        </nav>
    </header>

    <main>
        <section class="user-panel">
            <h2>Welcome, <span id="currentUser">User</span>! <span id="userRoleBadge" class="role-badge"></span></h2>
            <p>Points: <strong id="userPoints">0</strong></p>
            <a href="cosmetics1.html" class="shop-button">Customize Character</a>
        </section>

        <section class="post-creator">
            <h2>Share your code or thoughts 💬</h2>
            <form id="postForm">
                <textarea
                    id="postContent"
                    placeholder="What do you want to say? Share code, ideas, or questions..."
                    maxlength="1000"
                    required
                ></textarea>

                <div class="post-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="anonymousPost">
                        Post anonymously
                    </label>

                    <div class="media-upload">
                        <label for="postMedia" class="media-label">
                            📎 Attach Image / Video / File
                        </label>
                        <input
                            type="file"
                            id="postMedia"
                            accept="image/*,video/*,.pdf,.doc,.docx,.txt,.zip,.rar,.py,.js,.html,.css,.java,.cpp,.c"
                        >
                        <span id="mediaFileName" class="file-name"></span>
                    </div>
                </div>

                <p class="form-note">Posts from students require admin approval before appearing publicly. Teachers' posts are auto-approved.</p>

                <button type="submit">Post</button>
            </form>
        </section>

        <section class="forum-area">
            <h2>Code Forum</h2>
            <div id="postContainer"></div>
        </section>
    </main>

    <footer>
        <p>CICT Code Forum © 2026</p>
    </footer>

    <script src="script1.js"></script>
</body>
</html>
